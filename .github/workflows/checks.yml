name: checks
# The org's scrub (gitleaks, generic identifier patterns, DCO) over the PR's
# commits, title and body. The ruleset on main requires its `checks / scrub`
# status, so the caller job keeps the id `checks`. `edited` reruns it when the
# PR title or body changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.draft != true
    uses: Sneakers-PAM/.github/.github/workflows/scrub.yml@main
    with:
      # gonum.org: a public Go module host that appears in go.sum.
      # The long name is not a host: it is how the host-name pattern reads the
      # end of the generated descriptor in gen/go (a message name, three
      # protobuf length bytes that happen to be letters, then github.com).
      allowed-domains: >-
        gonum.org
        x1a9.sneakers.identity.v1.resolveserviceaccountbyoidcresponsebrzpgithub.com
