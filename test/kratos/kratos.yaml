# A throwaway Kratos for the integration tests: in-memory storage, dev mode,
# example.org URLs. Never use it for a real deployment.
version: v1.3.1
dsn: memory
serve:
  public:
    base_url: http://localhost:4433/
    host: 0.0.0.0
    port: 4433
  admin:
    base_url: http://localhost:4434/
    host: 0.0.0.0
    port: 4434
log:
  level: warning
  format: json
identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
courier:
  smtp:
    connection_uri: smtp://localhost:1025/?disable_starttls=true
    from_address: no-reply@example.org
selfservice:
  default_browser_return_url: http://localhost:3000/
  methods:
    password: { enabled: true }
    code: { enabled: true }
    totp: { enabled: false }
    webauthn: { enabled: false }
  flows:
    recovery:
      enabled: true
      use: code
      ui_url: http://localhost:3000/recovery
    login:
      ui_url: http://localhost:3000/login
